<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitectura de HipertAI</title>
<desc id="d">La interfaz web y los dispositivos hablan con una API FastAPI que guarda el registro clínico en PostgreSQL y el flujo crudo de los dispositivos en MongoDB. El modelo de apoyo a la decisión aún no existe.</desc>
