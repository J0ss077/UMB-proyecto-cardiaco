rains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">ingest</text><rect x="636" y="284" width="160" height="38" rx="10" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/><text x="716" y="309.5" font-size="16" fill="#e6edf3" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">audit</text><text x="464" y="370" font-size="15" fill="#9aa4b1">Un paquete por área, con el router HTTP</text><text x="464" y="391" font-size="15" fill="#9aa4b1">separado de la lógica del servicio.</text><rect x="930" y="70" width="250" height="150" rx="14" fill="#34d399" fill-opacity="0.09" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.6"/><text x="950" y="106" font-size="22" font-weight="700" fill="#e6edf3">PostgreSQL 16</text><text x="950" y="133" font-size="16.5" fill="#9aa4b1">Registro clínico</text><text x="950" y="155" font-size="16.5" fill="#9aa4b1">16 tablas, 7 enumerados</text><rect x="930" y="290" width="250" height="120" rx="14" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.6"/><text x="950" y="326" font-size="22" font-weight="700" fill="#e6edf3">MongoDB 7</text><text x="950" y="353" font-size="16.5" fill="#9aa4b1">Flujo crudo de los</text><text x="950" y="375" font-size="16.5" fill="#9aa4b1">dispositivos</text><rect x="440" y="452" width="380" height="96" rx="14" fill="#6e7886" fill-opacity="0.09" stroke="#6e7886" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="7 6"/><text x="460" y="488" font-size="19" font-weight="700" fill="#e6edf3">Modelo de apoyo a la decisión</text><text x="460" y="515" font-size="16.5" fill="#9aa4b1">Incremento posterior (ml/).</text><text x="460" y="537" font-size="16.5" fill="#9aa4b1">Todavía no existe.</text><path d="M320 145 H440" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="380" y="130" font-size="15" fill="#9aa4b1" text-anchor="middle">HTTP + JSON</text><text x="380" y="168" font-size="15" fill="#9aa4b1" text-anchor="middle">sesión JWT</text><path d="M320 350 H392 V303 H464" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="356" y="340" font-size="14" fill="#9aa4b1" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">POST</text><text x="382" y="374" font-size="14" fill="#9aa4b1" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">X-Device-Key</text><path d="M820 145 H930" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="875" y="130" font-size="15" fill="#9aa4b1" text-anchor="middle">SQL</text><path d="M820 340 H930" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="875" y="326" font-size="13.5" fill="#9aa4b1" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace">raw_readings</text><path d="M630 410 V452" stroke="#6e7886" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#ad)"/></svg>
