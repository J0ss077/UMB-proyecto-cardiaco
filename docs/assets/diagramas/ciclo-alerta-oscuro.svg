<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Ciclo de una alerta</title>
<desc id="d">Una alerta abierta pasa a acuse de recibo, validada o descartada. Solo un médico mueve la alerta y cada paso queda en la auditoría.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9aa4b1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6e7886" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="110" width="230" height="96" rx="14" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.6"/><text x="50" y="146" font-size="22" font-weight="700" fill="#e6edf3">Abierta</text><text x="50" y="173" font-size="16.5" fill="#9aa4b1">Pendiente de revisión</text><text x="50" y="195" font-size="16.5" fill="#9aa4b1">médica</text><rect x="400" y="110" width="230" height="96" rx="14" fill="#38a3ff" fill-opacity="0.09" stroke="#38a3ff" stroke-opacity="0.55" stroke-width="1.6"/><text x="420" y="146" font-size="22" font-weight="700" fill="#e6edf3">Acuse de recibo</text><text x="420" y="173" font-size="16.5" fill="#9aa4b1">El médico la vio,</text><text x="420" y="195" font-size="16.5" fill="#9aa4b1">aún sin resolver</text><rect x="790" y="40" width="280" height="88" rx="14" fill="#34d399" fill-opacity="0.09" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.6"/><text x="810" y="76" font-size="22" font-weight="700" fill="#e6edf3">Validada</text><text x="810" y="103" font-size="16.5" fill="#9aa4b1">Confirmada por el médico</text><rect x="790" y="188" width="280" height="88" rx="14" fill="#6e7886" fill-opacity="0.09" stroke="#6e7886" stroke-opacity="0.55" stroke-width="1.6"/><text x="810" y="224" font-size="22" font-weight="700" fill="#e6edf3">Descartada</text><text x="810" y="251" font-size="16.5" fill="#9aa4b1">Descartada por el médico</text><path d="M260 158 H400" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="330" y="146" font-size="15" fill="#9aa4b1" text-anchor="middle">acusar recibo</text><path d="M630 144 C700 144 720 84 790 84" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M630 172 C700 172 720 232 790 232" stroke="#9aa4b1" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="706" y="92" font-size="15" fill="#9aa4b1" text-anchor="middle">validar</text><text x="716" y="250" font-size="15" fill="#9aa4b1" text-anchor="middle">descartar</text><path d="M145 110 C145 40 300 18 520 18 C700 18 770 30 790 56" stroke="#6e7886" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#ad)"/><path d="M145 206 C145 280 300 302 520 302 C700 302 770 290 790 262" stroke="#6e7886" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#ad)"/><text x="520" y="40" font-size="15" fill="#9aa4b1" text-anchor="middle">también directo: validar</text><text x="520" y="292" font-size="15" fill="#9aa4b1" text-anchor="middle">también directo: descartar</text></svg>
