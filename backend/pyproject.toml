[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hta-backend"
version = "0.1.0"
description = "API de la plataforma de telemonitoreo para pacientes con hipertensión arterial"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pymongo>=4.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: pruebas unitarias que no tocan bases de datos",
    "integration: pruebas que requieren PostgreSQL y MongoDB",
]
