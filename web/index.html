<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Plataforma HTA</title>
        <style>
            :root {
                color-scheme: light;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                color: #1f2933;
                background: #f5f7fa;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem;
            }
            main {
                max-width: 42rem;
                background: #ffffff;
                border: 1px solid #d9e2ec;
                border-radius: 0.75rem;
                padding: 2rem;
                box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
            }
            h1 {
                margin-top: 0;
                font-size: 1.5rem;
            }
            p {
                line-height: 1.6;
            }
            code {
                background: #eef2f7;
                border-radius: 0.25rem;
                padding: 0.1rem 0.3rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Plataforma de telemonitoreo de hipertensión arterial</h1>
            <p>La interfaz web está en construcción. Por ahora este servicio solo comprueba que la pila de contenedores levanta y que la API responde.</p>
            <p>El estado de la API se consulta en <code>GET /api/health</code>.</p>
        </main>
    </body>
</html>
